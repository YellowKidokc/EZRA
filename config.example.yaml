# Copy to config.yaml beside the executable and replace the placeholders.
# Omit database_path to use the per-user local default.
# Omit output_dir to use tp-output beside the database.
# A relative path is relative to config.yaml.
# For a Windows UNC source, use a YAML single-quoted path as shown.
# scan_roots:
#   - '\\NAS_HOST\SHARE\CORPUS'
#   - '/path/to/local/corpus'
scan_roots: []

# Extra directory names to exclude. EZRA excludes .git, node_modules,
# .lake, __pycache__ and .obsidian by default.
skip_directories: []
