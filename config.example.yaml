# Specification example. Replace placeholders in an untracked config.yaml.
# The future implementation must validate the database path is genuinely local.
database_path: 'C:/Users/YOUR_NAME/AppData/Local/EZRA/tp_index.sqlite'
scan_roots:
  - '\\NAS_HOST\SHARE\Obsidian\MIM'
write_ids: false
quick_hash:
  enabled: false
  threshold_bytes: 209715200
  identity_use: candidate_only
skip_directories:
  - .git
  - node_modules
  - .lake
  - __pycache__
  - .obsidian
